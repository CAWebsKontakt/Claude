[project]
name = "twitchclip-ai"
version = "1.2.1"
description = "TwitchClip AI – rechtekonforme Twitch-Highlight-Erkennung und TikTok-Veröffentlichung"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "postgres: Test benötigt eine echte PostgreSQL-Datenbank (TEST_DATABASE_URL)",
]
filterwarnings = [
    "ignore::DeprecationWarning:rq.*",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S603", "S607", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107", "S108", "S311"]
"migrations/*" = ["E501"]

[tool.coverage.run]
source = ["app"]
